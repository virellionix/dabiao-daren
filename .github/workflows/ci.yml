name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run offline demo
        run: python examples/run_demo.py > /tmp/dabiao-daren-demo.json
      - name: Check public-release safety
        run: python scripts/public_release_check.py --history
